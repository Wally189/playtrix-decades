<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Playtrix Capture Pilot</title>
  <link rel="stylesheet" href="styles.css?v=20260723-1945">
</head>
<body>
  <main class="main">
    <header class="topbar">
      <div><span class="eyebrow">Owner-controlled private pilot</span><h1>Capture → classify → retain</h1><p>Tests the smallest repair to Playtrix's universal capture workflow.</p></div>
    </header>
    <section class="category-sheet">
      <div class="sheet-head"><div><span class="eyebrow">Universal capture</span><h3>What has your attention?</h3></div></div>
      <label>Item<textarea id="captureText" rows="4" placeholder="Write the item"></textarea></label>
      <label>Kind<select id="captureKind"><option value="action">Action</option><option value="waiting">Waiting</option><option value="idea">Idea</option><option value="information">Information</option></select></label>
      <label>Area<select id="captureArea"><option>Vocation &amp; Work</option><option>Faith &amp; Formation</option><option>House &amp; Stewardship</option><option>Finance &amp; Administration</option><option>Community &amp; Charity</option><option>Rest, Health &amp; Renewal</option></select></label>
      <button class="primary" id="saveCapture" type="button">Keep safely</button>
      <p id="saveStatus" aria-live="polite"></p>
    </section>
    <section class="category-sheet">
      <div class="sheet-head"><div><span class="eyebrow">Retained locally</span><h3>Loose captures</h3></div><button class="ghost" id="clearCaptures" type="button">Clear test data</button></div>
      <div id="captureList" class="simple-list"></div>
      <p><strong id="captureCount">0</strong> retained item(s) in this browser.</p>
    </section>
  </main>
  <script src="pilot-capture-fix.js"></script>
</body>
</html>
