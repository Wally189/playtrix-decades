name: Test and deploy Playtrix

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playtrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Static product safety and syntax checks
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile

          html=Path("index.html").read_text(encoding="utf-8")
          readme=Path("README.md").read_text(encoding="utf-8")

          required={"view","railNav","mobileNav","moreSheet","moreList","captureDialog","captureClose","captureCancel","captureSave","appearanceDialog","themeGrid","setupDialog","setupList","searchBtn","searchInput"}
          ids=set();duplicates=set();scripts=[]
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_script=False; self.buf=[]
              def handle_starttag(self,tag,attrs):
                  value=dict(attrs).get("id")
                  if value:
                      if value in ids: duplicates.add(value)
                      ids.add(value)
                  if tag == "script" and not dict(attrs).get("src"):
                      self.in_script=True; self.buf=[]
              def handle_data(self,data):
                  if self.in_script: self.buf.append(data)
              def handle_endtag(self,tag):
                  if tag == "script" and self.in_script:
                      scripts.append("".join(self.buf)); self.in_script=False
          p=Parser(); p.feed(html)
          missing=required-ids
          if duplicates: raise SystemExit(f"Duplicate HTML ids: {sorted(duplicates)}")
          if missing: raise SystemExit(f"Missing required product surfaces: {sorted(missing)}")
          if not scripts: raise SystemExit("No inline application script found")
          with tempfile.NamedTemporaryFile("w",suffix=".js",delete=False,encoding="utf-8") as f:
              f.write("\n".join(scripts)); js_path=f.name
          subprocess.run(["node","--check",js_path],check=True)

          required_phrases=[
              "Ink & Electric","Midnight & Signal","Teal & Coral","Chromatic Sections",
              "Hide or reorder sections without deleting their records.",
              "Inbox — decide later","Keep for later","Appearance","Organiser setup"
          ]
          absent=[x for x in required_phrases if x not in html]
          if absent: raise SystemExit(f"Missing Concept B requirements: {absent}")
          if "captureClose" not in html or "captureCancel" not in html: raise SystemExit("Capture requires independent Close and Cancel controls")
          if "confirm('Reset this organiser?" not in html: raise SystemExit("Reset requires explicit confirmation")
          if "playtrix.organiser.v4" not in html or "playtrix.organiser.v3" not in html: raise SystemExit("Current storage key and v3 migration source must be present")
          current=html+"\n"+readme
          if re.search(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}",current,re.I): raise SystemExit("Email address present in current product source")
          if re.search(r"https?://(?:docs|drive)\.google\.com/",current,re.I): raise SystemExit("Private-workspace style Google URL present in current product source")
          legacy_terms=["nbt grievance","weca onboarding","rosary","st joseph prayer"]
          lowered=current.lower();hits=[term for term in legacy_terms if term in lowered]
          if hits: raise SystemExit(f"Legacy fixture terms present in current product: {hits}")
          print("Static Playtrix v4 checks passed")
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
