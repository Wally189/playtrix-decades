name: Test and deploy Playtrix

on:
  push:
    branches: ["main", "hoc-playtrix-p0-remediation-20260905"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playtrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax check
        run: node --check recovery.js

      - name: Static product safety check
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          required = {
              "today", "inbox", "tasks", "projects", "waiting", "notes",
              "notyet", "tools", "review", "settings", "captureDialog",
              "editDialog", "dayClose"
          }
          ids = set()
          duplicates = set()

          class Parser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  value = data.get("id")
                  if value:
                      if value in ids:
                          duplicates.add(value)
                      ids.add(value)

          html = Path("index.html").read_text(encoding="utf-8")
          js = Path("recovery.js").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          Parser().feed(html)

          missing = required - ids
          if duplicates:
              raise SystemExit(f"Duplicate HTML ids: {sorted(duplicates)}")
          if missing:
              raise SystemExit(f"Missing required product surfaces: {sorted(missing)}")
          if '<dialog id="dayClose"' not in html:
              raise SystemExit("Day-close interaction must use a native dialog")
          if "localStorage.removeItem(KEY);localStorage.removeItem(PREVIOUS_KEY)" not in js:
              raise SystemExit("Reset must clear the previous migration source")

          current = html + "\n" + js + "\n" + readme
          if re.search(r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", current, re.I):
              raise SystemExit("Email address present in current product source")
          if re.search(r"https?://(?:docs|drive)\.google\.com/", current, re.I):
              raise SystemExit("Private-workspace style Google URL present in current product source")

          legacy_terms = ["nbt grievance", "weca onboarding", "rosary", "st joseph prayer"]
          lowered = current.lower()
          hits = [term for term in legacy_terms if term in lowered]
          if hits:
              raise SystemExit(f"Legacy fixture terms present in current product: {hits}")

          print("Static Playtrix checks passed")

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
